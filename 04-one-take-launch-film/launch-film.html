<div id="frame"><div id="stage"></div></div>

'use strict';

const W = 1440, C = W / 2;

// Closed-form step response of a damped spring (0 → 1). Pure in tau.

// ───────────────────────── dom helpers ─────────────────────────

// ───────────────────────── assets ─────────────────────────
const PHOTO = {

  dropGold: 'assets/photos/03-droplet-golden.png', sea: 'assets/photos/04-seascape.png',
  facade: 'assets/photos/05-facade.png', palm: 'assets/photos/06-palm-shadow.png',

const imgs = [];

// Displacement map from a rounded-rect distance field: the rim bends the backdrop outward, the centre stays flat.
const mapCache = new Map();

// A glass panel: clip box + filtered copy of the backdrop + rim light + content.
const GM = 64;   // copy margin so the rim can sample beyond the panel
function glassPanel(parent) {

const matEl = el('div', 'L', frameEl);
const printBox = el('div', 'L clip', S.wall);
const printImg = photo('sea', printBox);
const iris2 = irisSvg(S.wall, 'printClip');
const shadowCanvas = el('canvas', 'L', S.wall); shadowCanvas.width = FR.w; shadowCanvas.height = FR.h;
css(shadowCanvas, { mixBlendMode: 'multiply' });
const wallBlack = el('div', 'L', S.wall); css(wallBlack, { background: INK });
let video = null;
async function wallFrame(t) {
  const target = clamp(1.5 + (t - b(45)), 0, (video.duration || 13) - 0.05);
  if (Math.abs(video.currentTime - target) > 0.0005) {
    await new Promise(res => { video.addEventListener('seeked', res, { once: true }); video.currentTime = target; });
  }
  wallCanvas.getContext('2d').drawImage(video, 0, 0, W, W);
  // the leaf shadows fall on the frame too: the wall is normalised to white and multiplied on top
  const s = shadowCanvas.getContext('2d');
  s.filter = 'grayscale(1) brightness(1.22) contrast(1.35)';
  s.clearRect(0, 0, FR.w, FR.h);
  s.drawImage(video, FR.x / W * video.videoWidth, FR.y / W * video.videoHeight, FR.w / W * video.videoWidth, FR.h / W * video.videoHeight, 0, 0, FR.w, FR.h);
  s.filter = 'none';
}
async function renderWall(t) {
  const on = t >= b(45) + 0.28 && t < b(51) + 0.4;
  show(S.wall, on);
  if (!on) return;
  await wallFrame(t);
  box(wallCanvas, 0, 0, W, W);
  box(frameEl, FR.x, FR.y, FR.w, FR.h, { background: OAK,
    boxShadow: '0 2px 0 rgba(255,255,255,.25) inset, 0 -2px 0 rgba(0,0,0,.18) inset, 14px 22px 30px rgba(40,30,20,.28), 3px 5px 8px rgba(40,30,20,.25)' });
  box(matEl, FR.mold, FR.mold, FR.w - 2 * FR.mold, FR.h - 2 * FR.mold, { background: '#F7F5F0', boxShadow: 'inset 2px 3px 6px rgba(0,0,0,.22)' });
  const [px_, py_, pw, ph] = FR.print;
  box(printBox, px_, py_, pw, ph);
  css(printImg, { width: px(ph), height: px(ph), transform: `translate(${(pw - ph) / 2 - 40}px, 0px)` });
  // black shrinks into the print (b46), the iris opens (b48) and closes (b50), then the black floods out (b51)
  const k = clamp(spring(t - b(46) - 0.1, 2.6, 0.84), 0, 1.02);
  const out = clamp(spring(t - b(51), 3.4, 0.97), 0, 1);
  const big = [-80, -80, W + 160, W + 160];
  const bx = lerp(lerp(0, px_, k), big[0], out), by = lerp(lerp(0, py_, k), big[1], out);
  const bw = lerp(lerp(W, pw, k), big[2], out), bh = lerp(lerp(W, ph, k), big[3], out);
  box(wallBlack, bx, by, bw, bh);
  show(wallBlack, t < b(48) + 0.02 || t >= b(51));
  const a = clamp(track(t, [[0, 0], [b(48), 1, 4.2, 0.6], [b(50), 0, 3.8, 0.85]]), 0, 1.02);
  placeIris(iris2, px_, py_, pw, ph, a, false);
  show(iris2.svg, t >= b(48) - 0.02);
  box(shadowCanvas, FR.x, FR.y, FR.w, FR.h);
}

// ───────────────────────── cursor ─────────────────────────
const cur = sel('svg', { class: 'L', width: 44, height: 56, viewBox: '-4 -4 44 56' }, S.cursor);
const ring = sel('circle', { cx: 0, cy: 0, r: 30, fill: 'none', stroke: INK, 'stroke-width': 4, 'stroke-linecap': 'round', transform: 'rotate(-90)' }, cur);
sel('path', { d: 'M0 0V30L7.4 23.2L12 34L17 31.8L12.6 21.4H22.4Z', fill: INK, stroke: '#fff', 'stroke-width': 2.4, 'stroke-linejoin': 'round' }, cur);
const REST = [1120, 1170];
let CK = null;
function cursorKeys() {
  const pr = FR.print;
  return [
    [0, REST], [0.08, [WM.dot[0] + 6, WM.dot[1] + 4], 2.2, 0.95],
    [b(3) + 0.08, [1000, 900], 2.0, 1], [b(4) + 0.1, [C + 230, C + 30], 2.0, 1],
    [b(6) - 0.05, [1060, 1030], 2.0, 1],
    [b(11) + 0.2, DROP_W, 2.4, 1],
    [b(13) + 0.01, [C, C], 6, 1],                                        // (the zoom ride overrides this)
    [b(15) + 0.08, [1010, 980], 2.0, 1],
    [b(19) - 0.35, [C - 75, BAR.y + BAR.h / 2], 2.6, 1],
    [b(21) - 0.3, [BAR.x + SLIDE.x0, BAR.y + BAR.h / 2], 2.6, 1],
    [b(21) + 0.05, KNOB, 1.5, 1],
    [b(24), [C, 600], 6, 1],                                             // (the sphere drag overrides this)
    [b(26) + 0.15, [1030, 1080], 1.8, 1],
    [b(28) - 0.3, [C, 1296], 2.4, 1],
    [b(29) - 0.05, [1090, 1040], 2.0, 1],
    [b(30) - 0.25, [C + 6, PHONE[1] + 46], 2.4, 1],
    [b(31) + 0.1, [760, 430], 2.0, 1],
    [b(33) - 0.3, [760, 640], 2.4, 1],
    [b(34) - 0.2, [C + 40, C + 70], 2.4, 1],
    [b(34) + 0.24, [190, 75], 1.7, 1],
    [b(36) + 0.05, [930, 1180], 1.8, 1],
    [b(39) - 0.3, [SW_X + 82 + 32, SW_Y + 32], 2.4, 1],
    [b(40) - 0.25, [chipX(1) + 73, CHIP_Y + 34], 2.6, 1],
    [b(41) - 0.18, [CTA[0] + 270, CTA[1] + 52], 3.0, 1],
    [b(41) + 0.15, [1110, 1130], 1.8, 1],
    [b(47), [pr[0] + pr[2] * 0.56, pr[1] + pr[3] * 0.54], 2.2, 1],
    [b(51) + 0.2, REST, 1.8, 1],
  ];
}
function cursorAt(t) {
  if (t >= b(13) && t < b(15)) return toScreen(camera(t), DROP_W);      // rides the droplet through the zoom
  if (t >= b(23) && t < b(26)) { const s = sphereState(t); return [s.x, s.y]; }   // holds the lens
  return track2(t, CK);
}
const CLICKS = [b(2), b(5), b(12), b(19), b(28), b(30), b(33), b(39), b(40), b(41), b(48), b(50)];
const HOLDS = [[b(21) - 0.05, b(22) + 0.05], [b(23), b(26)], [b(34), b(36)]];
const LONG = [b(23), b(34)];
function renderCursor(t) {
  show(S.cursor, true);
  const [x, y] = cursorAt(t);
  let press = 0;
  for (const p of CLICKS) press += pulse(t, p - 0.05, 0.12);
  for (const [a, z] of HOLDS) press += clamp(spring(t - a, 6, 0.8)) - clamp(spring(t - z, 6, 0.8));
  const s = 1.22 * camera(t).Z * (1 - 0.14 * clamp(press));
  cur.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
  let lp = 0;
  for (const a of LONG) if (t >= a && t < a + 0.45) lp = clamp((t - a) / 0.24);
  const Lc = 2 * Math.PI * 30;
  ring.setAttribute('stroke-dasharray', `${Lc * lp} ${Lc}`);
  ring.setAttribute('opacity', lp > 0 ? 1 : 0);
}

// ───────────────────────── sound cues (placed by the mixer at each file's measured peak) ─────────────────────────
const SFX = [
  [b(2), 'click'], [b(3), 'pop'], [b(4), 'rise'], [b(5), 'click'], [b(5) + 0.05, 'shutter'], [b(6), 'shutter'],
  [b(7), 'pop'], [b(9), 'paper'], [b(10), 'paper'], [b(11), 'slide'], [b(12), 'click'], [b(13), 'whoosh'],
  ...[0, 1, 2, 3, 4].map(i => [b(15) + i * BEAT / 4, 'glass']), [b(17), 'liquid'], [b(18), 'pop'], [b(19), 'tap'],
  [b(20), 'slide'], [b(21), 'tick'], [b(23), 'glassy'], [b(24), 'whoosh'], [b(25), 'bubble'], [b(26), 'swell'],
  [b(27), 'tick'], [b(28), 'pop'], [b(29), 'suck'], [b(30), 'stretch'], [b(31), 'whoosh'], [b(33), 'blind'],
  [b(34), 'lift'], [b(35), 'page'], [b(36), 'thunk'], [b(37), 'scroll'], [b(38), 'pop'], [b(38) + 0.12, 'pop'],
  [b(39), 'click'], [b(40), 'click'], [b(40) + 0.15, 'slide'], [b(41), 'click'], [b(41) + 0.12, 'check'],
  [b(42), 'printer'], [b(43), 'van'], [b(44), 'ding'], [b(45), 'boom'], [b(48), 'shutter'], [b(50), 'shutter'],
  [b(51), 'whoosh'], [b(53), 'impact'],
];

// ───────────────────────── seek ─────────────────────────
const LAYERS = ['world', 'lock', 'desk', 'web', 'win', 'card', 'wall', 'order', 'open', 'iris', 'glass', 'cursor'];
async function seek(t) {
  t = clamp(t, 0, DUR - 1e-6);
  pending = [];
  renderOpen(t);
  renderIris(t);
  const cam = renderWorld(t);
  renderGlass(t, cam);
  renderLock(t);
  renderDesk(t);
  renderWin(t);
  renderCard(t);
  renderWeb(t);
  renderOrder(t);
  await renderWall(t);
  renderCursor(t);
  LAYERS.forEach((k, i) => { S[k].style.zIndex = String(i + 1); });
  if (t < b(5)) S.open.style.zIndex = '20';
  else if (t < b(7)) { S.open.style.zIndex = '1'; S.world.style.zIndex = '2'; }
  if (pending.length) await Promise.all(pending);
  await twoFrames();
}

async function init() {
  await Promise.all(['800 100px Archivo', '600 54px Geist', '500 19px Geist', '700 80px Geist'].map(f => document.fonts.load(f)));
  await document.fonts.ready;
  measure();
  CIRCLE_MAP = rrectMap(1024, 1024, 512, 470);
  LIGHT = glassLetters(S.glass, 'Light', 300, 'expanded', 92, 4);
  for (const L of LIGHT) S.glass.insertBefore(L.wrap, bar.outer);
  CLOCK = glassLetters(lockGroup, '18:24', 236, 'normal', 80, 2);
  CK = cursorKeys();
  await Promise.all(imgs.map(i => i.decode().catch(() => {})));
  const blob = await (await fetch(WALL_SRC)).blob();   // blob URL: simple servers cannot range-seek video
  video = document.createElement('video');
  video.muted = true; video.playsInline = true; video.preload = 'auto';
  video.src = URL.createObjectURL(blob);
  await new Promise(res => { video.addEventListener('loadeddata', res, { once: true }); video.load(); });
}

window.seek = seek;
window.DUR = DUR;
window.SFX = SFX;
window.ready = init().then(async () => {
  const q = new URLSearchParams(location.search);
  if (!q.has('render')) {
    document.body.classList.add('preview');
    const fit = () => document.body.style.setProperty('--fit', Math.min(innerWidth, innerHeight - 40) / W);
    fit(); addEventListener('resize', fit);
    const sc = document.getElementById('scrub');
    let busy = false, want = null;
    const go = async v => { want = v; if (busy) return; busy = true; while (want != null) { const x = want; want = null; await seek(x); } busy = false; };
    sc.addEventListener('input', () => go(+sc.value));
    sc.value = q.get('t') || 0;
    await seek(+sc.value);
  }
  return true;
});
